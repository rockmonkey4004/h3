<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form definitions</title></head>
<body>
<form name="h3-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="h3-contact">
  <input name="bot-field">
  <input name="name" type="text">
  <input name="email" type="email">
  <textarea name="message"></textarea>
</form>
</body>
</html>
